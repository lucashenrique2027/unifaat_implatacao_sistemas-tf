<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Lucas Henrique</title>
    <meta name="description" content="Formulário de contato do portfólio de Lucas Henrique.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Contato</h1>
        <p>Envie uma mensagem através do backend serverless AWS.</p>
    </header>
    <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="experiencia.html">Experiência</a>
        <a href="contato.html">Contato</a>
    </nav>
    <main>
        <form id="contactForm" data-endpoint="https://SEU_API_GATEWAY.execute-api.us-east-1.amazonaws.com/prod/contact">
            <label for="name">Nome</label>
            <input type="text" id="name" name="name" required placeholder="Seu nome">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com">
            <label for="message">Mensagem</label>
            <textarea id="message" name="message" required placeholder="Escreva sua mensagem..."></textarea>
            <button type="submit">Enviar Mensagem</button>
            <div id="contactStatus"></div>
        </form>
    </main>
    <footer>
        <p>© 2026 Lucas Henrique. Trabalho TF11.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
